<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Hooks · Storia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #D6E8C8;
    --mint-light: #E8F3DF;
    --mint-dark: #C2D9B0;
    --mint-stripe: rgba(180,210,155,0.35);
    --cream: #FAFAF7;
    --text: #1A1A18;
    --text-muted: #7A7A72;
    --text-light: #A8A89E;
    --accent-dot: #CC3322;
    --border: rgba(0,0,0,0.08);
    --surface: rgba(255,255,255,0.6);
    --stripe-w: 52px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--mint-light);
    background-image: repeating-linear-gradient(
      to right,
      transparent,
      transparent calc(var(--stripe-w) - 1px),
      var(--mint-stripe) calc(var(--stripe-w) - 1px),
      var(--mint-stripe) var(--stripe-w)
    );
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 40px 60px;
    position: relative;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -0.5px;
    position: fixed;
    top: 32px;
    left: 40px;
    z-index: 200;
    color: var(--text);
  }

  .logo span {
    color: var(--accent-dot);
  }

  .hero-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(56px, 9vw, 120px);
    font-weight: 800;
    font-style: italic;
    line-height: 0.92;
    letter-spacing: -2px;
    color: var(--text);
    margin-bottom: 32px;
  }

  .hero-title em {
    font-style: normal;
    color: var(--accent-dot);
  }

  .hero-desc {
    font-family: 'Lora', serif;
    font-size: 17px;
    font-style: italic;
    color: var(--text-muted);
    max-width: 480px;
    line-height: 1.75;
    margin-bottom: 56px;
  }

  .hero-stats {
    display: flex;
    gap: 56px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-light);
  }

  .scroll-cue {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--text-light);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }

  /* ── CONTROLS ── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(214, 232, 200, 0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 18px 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .filter-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-light);
    margin-right: 6px;
  }

  .filter-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
    padding: 7px 16px;
    border-radius: 40px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.22s ease;
    white-space: nowrap;
  }

  .filter-btn:hover {
    background: rgba(255,255,255,0.5);
    color: var(--text);
    border-color: rgba(0,0,0,0.15);
  }

  .filter-btn.active {
    background: var(--text);
    color: var(--mint-light);
    border-color: var(--text);
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px 8px 36px;
    border-radius: 40px;
    outline: none;
    width: 210px;
    transition: all 0.2s;
  }

  .search-input::placeholder { color: var(--text-light); }
  .search-input:focus {
    background: rgba(255,255,255,0.85);
    border-color: rgba(0,0,0,0.2);
  }

  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 14px;
    pointer-events: none;
  }

  /* ── GRID ── */
  .grid-wrap {
    padding: 48px 40px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .hook-card {
    background: var(--surface);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 4px;
    padding: 28px 28px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: all 0.25s ease;
    cursor: default;
    animation: fadeUp 0.4s ease both;
    position: relative;
    overflow: hidden;
  }

  .hook-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: transparent;
    transition: background 0.25s;
  }

  .hook-card:hover {
    background: rgba(255,255,255,0.82);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  }

  .hook-card:hover::before { background: var(--mint-dark); }
  .hook-card.copied::before { background: var(--accent-dot); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hook-num {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--text-light);
  }

  .hook-tag {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 40px;
    border: 1px solid;
  }

  .tag-curiosidad { color: #5A7A3A; border-color: rgba(90,122,58,0.3); background: rgba(90,122,58,0.08); }
  .tag-controversia { color: #B03020; border-color: rgba(176,48,32,0.25); background: rgba(176,48,32,0.07); }
  .tag-historia { color: #4A5A9A; border-color: rgba(74,90,154,0.25); background: rgba(74,90,154,0.07); }
  .tag-dato { color: #2A7A5A; border-color: rgba(42,122,90,0.25); background: rgba(42,122,90,0.07); }
  .tag-miedo { color: #8A4A1A; border-color: rgba(138,74,26,0.25); background: rgba(138,74,26,0.07); }
  .tag-identidad { color: #6A3A8A; border-color: rgba(106,58,138,0.25); background: rgba(106,58,138,0.07); }
  .tag-promesa { color: #1A6A8A; border-color: rgba(26,106,138,0.25); background: rgba(26,106,138,0.07); }
  .tag-error { color: #9A3A3A; border-color: rgba(154,58,58,0.25); background: rgba(154,58,58,0.07); }

  .hook-text {
    font-family: 'Lora', serif;
    font-size: 16px;
    font-style: italic;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
  }

  .hook-note {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.6;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
  }

  .copy-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-light);
    padding: 5px 14px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .copy-btn.done {
    border-color: var(--accent-dot);
    color: var(--accent-dot);
  }

  /* ── RESULTS BAR ── */
  .results-bar {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-light);
  }

  .results-bar span { color: var(--text-muted); font-weight: 500; }

  .no-results {
    display: none;
    text-align: center;
    padding: 80px 20px;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--text-light);
  }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 40px;
    text-align: center;
    background: rgba(255,255,255,0.3);
  }

  .footer-logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    font-style: italic;
    color: var(--text);
    margin-bottom: 8px;
  }

  .footer-logo span { color: var(--accent-dot); }

  .footer-tagline {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--text-light);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .logo { top: 20px; left: 20px; }
    .hero { padding: 80px 24px 60px; }
    .controls { padding: 14px 20px; }
    .grid-wrap { padding: 32px 16px 60px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .hero-stats { gap: 32px; }
    .search-wrap { margin-left: 0; width: 100%; }
    .search-input { width: 100%; }
    .hero-title { letter-spacing: -1px; }
  }
</style>
</head>
<body>

<div class="logo">S<span>.</span></div>

<!-- HERO -->
<section class="hero">
  <p class="hero-eyebrow">Guía de Contenidos · Storia</p>
  <h1 class="hero-title">
    100 hooks<br>
    que paran<br>
    el <em>scroll.</em>
  </h1>
  <p class="hero-desc">Guarda este recurso, para que te salve cuando lo necesites.</p>
  <div class="hero-stats">
    <div class="stat">
      <span class="stat-num">100</span>
      <span class="stat-label">Hooks</span>
    </div>
    <div class="stat">
      <span class="stat-num">8</span>
      <span class="stat-label">Categorías</span>
    </div>
    <div class="stat">
      <span class="stat-num">∞</span>
      <span class="stat-label">Nichos</span>
    </div>
  </div>
  <div class="scroll-cue">
    <span>Explorar</span>
    <span>↓</span>
  </div>
</section>

<!-- CONTROLS -->
<div class="controls">
  <span class="filter-label">Ver</span>
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="curiosidad">Curiosidad</button>
  <button class="filter-btn" data-cat="controversia">Controversia</button>
  <button class="filter-btn" data-cat="historia">Historia</button>
  <button class="filter-btn" data-cat="dato">Dato Shock</button>
  <button class="filter-btn" data-cat="miedo">Urgencia</button>
  <button class="filter-btn" data-cat="identidad">Identidad</button>
  <button class="filter-btn" data-cat="promesa">Promesa</button>
  <button class="filter-btn" data-cat="error">Error Común</button>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="text" placeholder="Buscar..." id="searchInput">
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="no-results" id="noResults">Ningún hook coincide con tu búsqueda.</div>
</div>

<div class="results-bar">Mostrando <span id="countDisplay">100</span> hooks</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">S<span>.</span></div>
  <p class="footer-tagline">Contenido que no se puede ignorar.</p>
</footer>

<script>
const hooks = [
  { id:1, cat:"curiosidad", text:"Nadie te va a enseñar esto en la escuela, y yo lo aprendí de la peor manera.", note:"Activa la curiosidad + historia personal. Funciona en finanzas, salud, relaciones, negocios." },
  { id:2, cat:"curiosidad", text:"Esto que ves aquí me tomó 3 años entender… y lo vas a entender en 60 segundos.", note:"Contraste de tiempo. Hace sentir al espectador que está ganando algo valioso rápido." },
  { id:3, cat:"curiosidad", text:"Te voy a mostrar el proceso que nadie muestra porque les da miedo que lo sepas.", note:"Activa la narrativa de 'secreto revelado'. Muy potente en marketing, cocina, fitness." },
  { id:4, cat:"curiosidad", text:"¿Qué pasaría si todo lo que te dijeron sobre [TEMA] estuviera mal?", note:"Abre un loop mental que el cerebro necesita cerrar. No puede irse sin escuchar la respuesta." },
  { id:5, cat:"curiosidad", text:"Esto se ve raro al principio, pero quédate porque el final lo cambia todo.", note:"Promesa de recompensa al final. Retención garantizada si el contenido cumple." },
  { id:6, cat:"curiosidad", text:"Hace 6 meses no sabía que esto existía. Hoy es lo que más uso.", note:"Naturalidad + descubrimiento. Genera empatía inmediata." },
  { id:7, cat:"curiosidad", text:"La pregunta que nadie hace sobre [TEMA] pero todos deberían.", note:"Posiciona al creador como el que 'sabe más'. Ideal para educación y nicho experto." },
  { id:8, cat:"curiosidad", text:"Esto solo lo saben los que llevan años en [ÁREA]. Hoy te lo cuento.", note:"Exclusividad percibida. El espectador siente que accede a información de élite." },
  { id:9, cat:"curiosidad", text:"Mira lo que pasa cuando combinas [COSA A] con [COSA B]. Spoiler: no es lo que esperas.", note:"El 'spoiler' contradictorio es un gancho poderoso. Funciona en cocina, experimentos, negocios." },
  { id:10, cat:"curiosidad", text:"Hay algo que llevo tiempo queriendo decirles y hoy se los cuento.", note:"Humaniza al creador. Genera expectativa con tono íntimo." },
  { id:11, cat:"curiosidad", text:"El truco que los expertos no mencionan en sus tutoriales sobre [TEMA].", note:"Ataca el 'gap' entre el conocimiento público y el real. Muy efectivo." },
  { id:12, cat:"curiosidad", text:"Pasé [TIEMPO] probando esto y los resultados me sorprendieron incluso a mí.", note:"Credibilidad por experiencia propia + sorpresa del experto." },
  { id:13, cat:"curiosidad", text:"¿Has notado que cuando haces [ACCIÓN] siempre pasa [COSA]? Hay una razón.", note:"Valida una experiencia del espectador y le da respuesta. Muy adictivo." },
  { id:14, cat:"curiosidad", text:"No busques esto en Google porque las respuestas que vas a encontrar están incompletas.", note:"Genera urgencia para ver TU contenido en lugar de irse a otra fuente." },
  { id:15, cat:"curiosidad", text:"Esto que parece complicado se resume en una sola cosa. Una sola.", note:"Simplificación poderosa. El cerebro ama los atajos mentales." },

  { id:17, cat:"controversia", text:"Me van a odiar por decir esto, pero alguien tiene que hacerlo.", note:"Crea anticipación al drama. Usa solo si de verdad tienes algo valioso que decir." },
  { id:18, cat:"controversia", text:"Todo el mundo habla de [MÉTODO POPULAR] y yo fui el que lo usó por 6 meses. Aquí mi veredicto real.", note:"Rompe con el consenso desde la experiencia propia. Muy creíble y compartible." },
  { id:19, cat:"controversia", text:"[GURÚ O FIGURA DE TU NICHO] tiene razón en casi todo... menos en esto.", note:"Usa la autoridad ajena para construir la tuya. Con respeto, no con ataque." },
  { id:20, cat:"controversia", text:"Si llevas tiempo en [NICHO] y nunca cuestionaste [PRÁCTICA COMÚN], tenemos que hablar.", note:"Apela directamente a la identidad del espectador. Casi imposible de ignorar si eres del nicho." },

  { id:23, cat:"controversia", text:"Cambié de opinión sobre [TEMA] y no me da vergüenza decirlo.", note:"Vulnerabilidad intelectual. Genera respeto y mucha conversación en comentarios." },
  { id:24, cat:"controversia", text:"Lo que te venden como 'la solución' para [PROBLEMA] en realidad tiene un problema enorme.", note:"Rompe una ilusión de mercado. Muy efectivo en salud, finanzas, fitness, tecnología." },
  { id:25, cat:"controversia", text:"Estuve de acuerdo con todos hasta que lo probé yo mismo.", note:"Experiencia personal que desafía el consenso. Muy humano y creíble." },

  { id:27, cat:"controversia", text:"¿Por qué todo el mundo hace [COSA] si hay una forma mucho más eficiente?", note:"Invita a cuestionarse sin atacar directamente. Abre diálogo." },

  { id:29, cat:"historia", text:"Hace [TIEMPO] era el tipo de persona que [ESTADO ANTERIOR]. Hoy soy esto.", note:"Arco de transformación. Funcionan en casi todos los nichos." },

  { id:31, cat:"historia", text:"Nadie me creyó cuando dije que iba a [LOGRO]. Permíteme mostrarte cómo pasó.", note:"Underdog story. Una de las más poderosas narrativas humanas." },
  { id:32, cat:"historia", text:"La conversación que tuve con [PERSONA/ROL] cambió completamente cómo veo [TEMA].", note:"Diálogo revelador. Humaniza y da perspectiva externa al espectador." },

  { id:40, cat:"historia", text:"No lo cuento mucho, pero esto fue lo que realmente me cambió en [ÁREA].", note:"Tono íntimo. Hace sentir al espectador como si recibiera información especial." },
  { id:41, cat:"dato", text:"El [%] de personas que hacen [COSA] no saben que están [CONSECUENCIA].", note:"Estadística + consecuencia. El espectador quiere saber si él está en ese porcentaje." },
  { id:42, cat:"dato", text:"En [PAÍS/MUNDO], [CIFRA SORPRENDENTE] sobre [TEMA]. Nadie habla de esto.", note:"Dato con contexto geográfico. Activa la comparación y el asombro." },
  { id:43, cat:"dato", text:"Esto cuesta [PRECIO BAJO] y hace lo mismo que lo que cobran [PRECIO ALTO].", note:"Comparativa de valor. Efectivo en nichos de consumo, tecnología, bienestar." },

const tagLabels = {
  curiosidad:"Curiosidad", controversia:"Controversia", historia:"Historia",
  dato:"Dato Shock", miedo:"Urgencia", identidad:"Identidad",
  promesa:"Promesa", error:"Error Común"
};

let currentCat = "all";
let currentSearch = "";

function render() {
  const grid = document.getElementById("grid");
  const noResults = document.getElementById("noResults");
  const count = document.getElementById("countDisplay");

  const filtered = hooks.filter(h => {
    const cm = currentCat === "all" || h.cat === currentCat;
    const sm = !currentSearch || h.text.toLowerCase().includes(currentSearch) || h.note.toLowerCase().includes(currentSearch);
    return cm && sm;
  });

  count.textContent = filtered.length;
  if (!filtered.length) {
    grid.innerHTML = "";
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  grid.innerHTML = filtered.map((h, i) => `
    <div class="hook-card" id="card-${h.id}" style="animation-delay:${(i % 12) * 0.04}s">
      <div class="card-top">
        <span class="hook-num">${String(h.id).padStart(3,"0")}</span>
        <span class="hook-tag tag-${h.cat}">${tagLabels[h.cat]}</span>
      </div>
      <div class="hook-text">"${h.text}"</div>
      <div class="hook-note">${h.note}</div>
      <div class="card-footer">
        <button class="copy-btn" onclick="copyHook(${h.id}, this)">Copiar</button>
      </div>
    </div>
  `).join("");
}

function copyHook(id, btn) {
  const h = hooks.find(x => x.id === id);
  if (!h) return;
  navigator.clipboard.writeText(h.text).then(() => {
    const card = document.getElementById(`card-${id}`);
    btn.textContent = "✓ Copiado";
    btn.classList.add("done");
    card.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "Copiar";
      btn.classList.remove("done");
      card.classList.remove("copied");
    }, 2000);
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value.toLowerCase().trim();
  render();
});

render();
